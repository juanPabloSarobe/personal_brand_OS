services:
  core-api:
    build: ./core-api
    env_file: .env
    environment:
      - DB_PATH=/data/pbos.db
      - MEDIA_DIR=/data/media
    volumes:
      - pbos_data:/data
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      - CORE_API_URL=http://core-api:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - N8N_DIAGNOSTICS_ENABLED=false
      # n8n v20+ bloquea $env en los nodos por defecto (breaking change). El workflow
      # lee CORE_API_URL, TELEGRAM_BOT_TOKEN e INTERNAL_API_SECRET vía $env, así que
      # sin esto las llamadas salen con la URL vacía y el bot queda mudo.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - N8N_PAYLOAD_SIZE_MAX=48
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - core-api

  puente-telegram:
    build: ./puente-telegram
    init: true
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/telegram
    restart: unless-stopped
    depends_on:
      - n8n

volumes:
  pbos_data:
    name: pbos_data # nombre fijo: scripts/backup.sh y restore.sh lo referencian literal,
                     # sin depender del nombre de proyecto de compose.
  n8n_data:
